services:
  econolite-virtual-controller:
    image: "${EVC_IMAGE:-usdotfhwastol/econolite-virtual-controller:save}"
    volumes:
      - type: bind
        source: "${EVC_SUMO_RESOURCE_PATH:?EVC_SUMO_RESOURCE_PATH is required}"
        target: /home/carma/src/resources
        read_only: true
    command: >-
      bash -c "/home/carma/docker/start_evc.sh
      --traci-ip cdasim
      --evc-sumo-cfg-path
      /home/carma/src/resources/${EVC_SUMO_CFG_FILE:?EVC_SUMO_CFG_FILE is required}"
