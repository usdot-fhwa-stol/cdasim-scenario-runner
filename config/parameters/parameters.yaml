# User-selected deployment and scenario behavior.
# Service networks, Docker hostnames, and required DNS aliases are
# generated by Scenario Runner and must not be configured here.

test_cases:
  - label: town10_single_vehicle
    runtime_seconds: 90
    MAP: Town10

    env_settings:
      cdasim:
        PROJECT_NAME: cdasim
        CONFIG_IMAGE_FULL: usdotfhwastoldev/cdasim-config:cdasim-basic-config
        CONFIG_COMPOSE_PATH: /opt/carma-simulation/config/docker-compose.yml
        CONFIG_IMAGE_PULL_POLICY: missing
        COMPOSE_OVERRIDES: []
        settings:
          MOSAIC_SCENARIO: Town10
          CDASIM_IMAGE: usdotfhwastoldev/cdasim:develop
          CARLA_RENDER_OFFSCREEN: false
          CARLA_SENSOR_LIB_IMAGE: usdotfhwastol/carla-sensor-lib:carma-system-4.13.0
          XML_RPC_SERVER_IMAGE: usdotfhwastoldev/xml-rpc-server:develop

      vehicles:
        - PROJECT_NAME: platform_vehicle_1
          COMPONENT: platform
          CONFIG_IMAGE_FULL: usdotfhwastoldev/carma-config:develop-basic-simulation-platform-vehicle
          CONFIG_COMPOSE_PATH: /opt/carma/vehicle/config/docker-compose.yml
          CONFIG_IMAGE_PULL_POLICY: missing
          COMPOSE_OVERRIDES: []
          settings:
            VEHICLE_ID: carma_1
            CARMA_PLATFORM_IMAGE: usdotfhwastol/carma-platform:carma-system-4.10.0
            CARMA_CARLA_INTEGRATION_IMAGE: usdotfhwastoldev/carma-carla-integration:develop
            V2X_ROS_DRIVER_IMAGE: usdotfhwastol/v2x-ros-driver:carma-system-4.11.0
            VEHICLE_REGISTRATION_IMAGE: usdotfhwastoldev/carma-ns3-adapter:develop
            SELECTED_ROUTE: Town10_event_route_1
            START_DELAY_IN_SECONDS: 20.0
            SPAWN_POINT:
              x: 50.6
              y: 133.5
              z: 0.0
              roll: 0.0
              pitch: 0.0
              yaw: 180.0

    data_output:
      output_directory: /opt/carma-simulation/tests/output/town10
      collect:
        mosaic_logs: /opt/carma-simulation/logs
        rosbags: /opt/carma/logs

  - label: town10_two_vehicles
    runtime_seconds: 300
    MAP: Town10

    env_settings:
      cdasim:
        PROJECT_NAME: cdasim
        CONFIG_IMAGE_FULL: usdotfhwastoldev/cdasim-config:cdasim-basic-config
        CONFIG_COMPOSE_PATH: /opt/carma-simulation/config/docker-compose.yml
        CONFIG_IMAGE_PULL_POLICY: missing
        COMPOSE_OVERRIDES: []
        settings:
          MOSAIC_SCENARIO: Town10
          CDASIM_IMAGE: usdotfhwastoldev/cdasim:develop
          CARLA_RENDER_OFFSCREEN: false
          CARLA_SENSOR_LIB_IMAGE: usdotfhwastol/carla-sensor-lib:carma-system-4.13.0
          XML_RPC_SERVER_IMAGE: usdotfhwastoldev/xml-rpc-server:develop

      vehicles:
        - PROJECT_NAME: platform_vehicle_1
          COMPONENT: platform
          CONFIG_IMAGE_FULL: usdotfhwastoldev/carma-config:develop-basic-simulation-platform-vehicle
          CONFIG_COMPOSE_PATH: /opt/carma/vehicle/config/docker-compose.yml
          CONFIG_IMAGE_PULL_POLICY: missing
          COMPOSE_OVERRIDES: []
          settings:
            VEHICLE_ID: carma_1
            CARMA_PLATFORM_IMAGE: usdotfhwastol/carma-platform:carma-system-4.10.0
            CARMA_CARLA_INTEGRATION_IMAGE: usdotfhwastoldev/carma-carla-integration:develop
            V2X_ROS_DRIVER_IMAGE: usdotfhwastol/v2x-ros-driver:carma-system-4.11.0
            VEHICLE_REGISTRATION_IMAGE: usdotfhwastoldev/carma-ns3-adapter:develop
            SELECTED_ROUTE: Town10_event_route_1
            START_DELAY_IN_SECONDS: 30.0
            SPAWN_POINT:
              x: 58.6
              y: 133.5
              z: 0.0
              roll: 0.0
              pitch: 0.0
              yaw: 180.0

        - PROJECT_NAME: platform_vehicle_2
          COMPONENT: platform
          CONFIG_IMAGE_FULL: usdotfhwastoldev/carma-config:develop-basic-simulation-platform-vehicle
          CONFIG_COMPOSE_PATH: /opt/carma/vehicle/config/docker-compose.yml
          CONFIG_IMAGE_PULL_POLICY: missing
          COMPOSE_OVERRIDES: []
          settings:
            VEHICLE_ID: carma_2
            CARMA_PLATFORM_IMAGE: usdotfhwastol/carma-platform:carma-system-4.10.0
            CARMA_CARLA_INTEGRATION_IMAGE: usdotfhwastoldev/carma-carla-integration:develop
            V2X_ROS_DRIVER_IMAGE: usdotfhwastol/v2x-ros-driver:carma-system-4.11.0
            VEHICLE_REGISTRATION_IMAGE: usdotfhwastoldev/carma-ns3-adapter:develop
            SELECTED_ROUTE: Town10_event_route_1
            START_DELAY_IN_SECONDS: 10.0
            SPAWN_POINT:
              x: 50.6
              y: 133.5
              z: 0.0
              roll: 0.0
              pitch: 0.0
              yaw: 180.0
      streets:
        - PROJECT_NAME: street_1
          COMPOSE_FILE: oci://docker.io/usdotfhwaops/v2xhub-application:develop
          COMPOSE_OVERRIDES: [
            ../compose/streets-override.yml
          ]
          settings:
            STOL_ORG: usdotfhwastoldev
            STOL_TAG: develop
            V2XHUB_VERSION: develop
            INFRASTRUCTURE_ID: rsu_1234
            INFRASTRUCTURE_NAME: Intersection 1
            EVC:
              enable: false
              snmp_port: 5555
            SENSORS:
              enable: false
              sensor_id: lidar_1
              type: SemanticLidarSensor
            SPAWN_POSITION:
              x: 100.0
              y: 0.0
              z: 0.0
              yaw: 180.0
        - PROJECT_NAME: street_2
          COMPOSE_FILE: oci://docker.io/usdotfhwaops/v2xhub-application:develop
          COMPOSE_OVERRIDES: [
            ../compose/streets-override.yml
          ]
          settings:
            STOL_ORG: usdotfhwastoldev
            STOL_TAG: develop
            V2XHUB_VERSION: develop
            INFRASTRUCTURE_ID: rsu_5678
            INFRASTRUCTURE_NAME: Intersection 2
            EVC:
              enable: false
              snmp_port: 5556
              evc_image_full: usdotfhwastol/econolite-virtual-controller:save
            SENSORS:
              enable: false
              sensor_id: lidar_2
              type: SemanticLidarSensor
            SPAWN_POSITION:
              x: 110.0
              y: 0.0
              z: 0.0
              yaw: 180.0

    data_output:
      output_directory: /opt/carma-simulation/tests/output/town10
      collect:
        mosaic_logs: /opt/carma-simulation/logs
        rosbags: /opt/carma/logs
