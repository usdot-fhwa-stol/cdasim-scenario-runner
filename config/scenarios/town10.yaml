# User-selected deployment and scenario behavior.
# Service networks, Docker hostnames, and required DNS aliases are
# generated by Scenario Runner and must not be configured here.

test_cases:
  - label: test_case_1
    runtime_seconds: 300
    MAP: Town10

    env_settings:
      cdasim:
        PROJECT_NAME: cdasim
        COMPOSE_FILE: oci://usdotfhwastolcandidate/cdasim-application:release-aventador
        CONFIG_IMAGE_PULL_POLICY: missing
        COMPOSE_OVERRIDES:
          - ../compose/cdasim-ns3-runtime.override.yml
          - ../compose/cdasim-town10-sumo.override.yml
        settings:
          COMPOSE_PROFILES:
            - evc
          MOSAIC_SCENARIO: Town10
          NS3_FEDERATE_IMAGE: usdotfhwastolcandidate/ns3-federate:aventador-5g-nr
          CDASIM_IMAGE: usdotfhwastolcandidate/cdasim:aventador
          EVC_IMAGE: usdotfhwastol/econolite-virtual-controller:save
          CARLA_RENDER_OFFSCREEN: false
          CARLA_SENSOR_LIB_IMAGE: usdotfhwastol/carla-sensor-lib:carma-system-4.13.0
          XML_RPC_SERVER_IMAGE: usdotfhwastolcandidate/xml-rpc-server:aventador
          EVC_SUMO_CFG_FILE: evc_sumo_cfg_468.json
          EVC_SPAT_FORWARDING:
            - listen_ip: 127.0.0.1
              listen_port: 16053
              destination_infrastructure: street_1
              destination_port: 6053
          CDASIM_RESOURCES:
            pyeos_db: .pyeos.db
            evc_sumo:
              - evc_sumo_cfg_468.json
              - intersection_1_tl_468_spat_16053.cfg
            sumocfg: Town10_client_2.sumocfg
      vehicles:
        - PROJECT_NAME: platform_vehicle_1
          COMPONENT: platform
          CONFIG_IMAGE_FULL: usdotfhwastolcandidate/carma-config:aventador-basic-simulation-platform-vehicle
          CONFIG_COMPOSE_PATH: /opt/carma/vehicle/config/docker-compose.yml
          CONFIG_IMAGE_PULL_POLICY: missing
          COMPOSE_OVERRIDES: []
          CONFIG_OVERRIDES:
            VehicleConfigParams.yaml: speed_limit_20.yaml
          settings:
            VEHICLE_ID: carma_1
            CARMA_PLATFORM_IMAGE: usdotfhwastol/carma-platform:carma-system-4.10.0
            CARMA_CARLA_INTEGRATION_IMAGE: usdotfhwastolcandidate/carma-carla-integration:aventador
            V2X_ROS_DRIVER_IMAGE: usdotfhwastolcandidate/v2x-ros-driver:aventador
            VEHICLE_REGISTRATION_IMAGE: usdotfhwastol/carma-ns3-adapter:carma-system-4.13.0
            SELECTED_ROUTE: loop_route
            START_DELAY_IN_SECONDS: 10.0
            SPAWN_POINT:
              x: 50.6
              y: 133.5
              z: 0.0
              roll: 0.0
              pitch: 0.0
              yaw: 180.0
      streets:
        - PROJECT_NAME: street_1
          COMPOSE_FILE: oci://docker.io/usdotfhwaops/v2xhub-application:release-aventador
          COMPOSE_OVERRIDES: []
          settings:
            STOL_ORG: usdotfhwastolcandidate
            STOL_TAG: aventador
            V2XHUB_VERSION: release-aventador
            INFRASTRUCTURE_ID: rsu_1234
            INFRASTRUCTURE_NAME: Intersection 1
            SAVE_STATE_FILE_PATH: /var/www/download/v2x_hub_state_intersection_1.sql.gz.enc
            SAVE_STATE_PASS_PHRASE: cdasim
            INFRASTRUCTURE_RESOURCES:
              v2xhub_db_init: default.localhost.sql
              v2xhub_save_state: v2x_hub_state_intersection_1.sql.gz.enc
              sensor: lidar_config_template.json
              j2735_map: MAP_Intersection_1.txt
            SENSORS:
              sensor_id: lidar_1
              type: SemanticLidar
              location:
                x: -46.0
                y: -127.1
            SPAWN_POSITION:
              x: -46.0
              y: -127.1
              z: 0.0
              yaw: 180.0

    data_output:
      data_analyzer_image: usdotfhwastolcandidate/cdasim-data-analysis:aventador
      output_directory: /opt/carma-simulation/tests/output
      collect:
        mosaic_logs: /opt/carma-simulation/logs
        carla_sensor_lib_logs: /opt/carla-sensor-lib
        rosbags: /opt/carma/logs

